<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{basePath}}css/style.css">
  <link rel="alternate" type="application/atom+xml" title="{{title}} — all updates" href="{{basePath}}feed.xml">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <nav class="site-nav" aria-label="Primary">
    <a class="site-nav__brand" href="{{basePath}}" aria-label="Thought Grain — home">
      <span class="brand-name">Thought Grain</span>
    </a>
    <div class="site-nav__links">
      <a class="site-nav__link" href="{{basePath}}essays/">Writing</a>
      <a class="site-nav__link" href="{{basePath}}projects/">Making</a>
      <a class="site-nav__link" href="{{basePath}}enjoying/">Enjoying</a>
      <a class="site-nav__link" href="{{basePath}}about/">About</a>
      <button id="theme-toggle" class="site-nav__theme" type="button" aria-label="Toggle theme">
        <svg class="theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </nav>

  {{content}}

  <footer class="site-footer">
    <div class="site-footer__row">
      <span class="site-footer__wordmark">Thought Grain</span>
      <ul class="site-footer__links">
        <li><a href="{{basePath}}essays/">Writing</a></li>
        <li><a href="{{basePath}}projects/">Making</a></li>
        <li><a href="{{basePath}}enjoying/">Enjoying</a></li>
        <li><a href="{{basePath}}about/">About</a></li>
        <li><a href="{{basePath}}colophon/">Colophon</a></li>
        <li><a href="{{basePath}}feed.xml">RSS</a></li>
        <li><a href="mailto:{{email}}">Email</a></li>
      </ul>
    </div>
    <div class="site-footer__credit">
      <span>&copy; 2021&ndash;2026 {{ownerName}}</span>
      <span>&middot;</span>
      <span>Set in Newsreader &amp; Inter</span>
    </div>
  </footer>

  <script src="{{basePath}}js/main.js"></script>
</body>
</html>
